[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgescan"
version = "0.1.0"
license = { text = "MIT" }
description = "Scanner quotidien de setups sur futures : probabilités calibrées, espérance nette, alertes."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0", "numpy>=1.26", "scikit-learn>=1.4", "scipy>=1.11",
  "matplotlib>=3.8", "pyyaml>=6.0", "requests>=2.31",
]

[project.optional-dependencies]
live = ["yfinance>=0.2.40", "lightgbm>=4.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
edgescan = "edgescan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
